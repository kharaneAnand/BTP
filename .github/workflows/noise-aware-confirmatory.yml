name: Noise-aware OTFS receiver bank confirmatory replications

on:
  push:
    branches:
      - "research/lmmse-diverse-receiver"
    paths:
      - "docs/LMMSE_CONFIRMATORY_READY.md"
  workflow_dispatch:

concurrency:
  group: noise-aware-confirmatory
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  confirmatory-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        seed: [62, 63, 64, 65]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML scipy matplotlib textremo-toolbox
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen V2 noise-aware receiver bank
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python -m unittest discover -s tests -p "test_pilot_noise_estimator.py"
          python -m pip install pytest
          pytest -q tests/test_linear_mmse_torch.py
          python experiments/noise_estimation/run_noise_aware_specialist_router.py \
            --seed ${{ matrix.seed }} \
            --device cpu \
            --output-dir experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}
      - name: Upload independent confirmatory results
        uses: actions/upload-artifact@v4
        with:
          name: noise-aware-seed-${{ matrix.seed }}
          path: |
            experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}/summary.json
            experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}/*.csv
            experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}/checkpoints/*.pt
            experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}/training/*.csv
            experiments/noise_estimation/confirmatory_results/seed${{ matrix.seed }}/dataset/processed/noise_estimator_calibration_v2.json
          if-no-files-found: error

  pooled-analysis:
    runs-on: ubuntu-latest
    needs: confirmatory-seeds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis dependencies
        run: python -m pip install numpy pandas
      - name: Download all four independent seed artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: noise-aware-seed-*
          path: artifacts
          merge-multiple: false
      - name: Recompute pooled paired statistics and acceptance criteria
        run: |
          python evaluations/noise_aware/summarize_noise_aware_runs.py \
            --results-root artifacts \
            --seeds 62 63 64 65 \
            --output-dir pooled-results
      - name: Upload pooled research summary
        uses: actions/upload-artifact@v4
        with:
          name: noise-aware-pooled-confirmatory-summary
          path: |
            pooled-results/pooled_summary.json
            pooled-results/per_seed_summary.csv
            pooled-results/per_condition_pooled.csv
          if-no-files-found: error
