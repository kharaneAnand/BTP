name: Research validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out BTP
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML scipy matplotlib textremo-toolbox
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v
