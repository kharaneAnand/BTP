name: Pilot-guard noise estimator validation

on:
  push:
    branches:
      - "research/pilot-noise-estimator"
    paths:
      - "models/supervisor/pilot_noise_estimator.py"
      - "experiments/noise_estimation/**"
      - "tests/test_pilot_noise_estimator.py"
      - ".github/workflows/pilot-noise-estimator.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-noise-estimator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        seed: [55, 56]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numerical dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas PyYAML textremo-toolbox
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Unit tests and fresh-seed estimator evaluation
        env:
          PYTHONPATH: .
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
        run: |
          python -m unittest discover -s tests -p "test_pilot_noise_estimator.py"
          python experiments/noise_estimation/evaluate_pilot_noise_estimator.py \
            --seed ${{ matrix.seed }} \
            --output-dir experiments/noise_estimation/results/seed${{ matrix.seed }}
      - name: Upload pilot noise estimation results
        uses: actions/upload-artifact@v4
        with:
          name: pilot-noise-estimator-seed-${{ matrix.seed }}
          path: |
            experiments/noise_estimation/results/seed${{ matrix.seed }}/summary.json
            experiments/noise_estimation/results/seed${{ matrix.seed }}/per_sample_noise_estimates.csv
            experiments/noise_estimation/results/seed${{ matrix.seed }}/per_condition_noise_estimates.csv
            experiments/noise_estimation/results/seed${{ matrix.seed }}/delay_column_power_diagnostics.csv
          if-no-files-found: error
